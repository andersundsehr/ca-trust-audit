name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l cmd pkg internal)"
      - name: Installer syntax
        run: sh -n install.sh
      - run: go vet ./...
      - run: go test -count=1 -race -coverprofile=coverage.out ./...
      - name: Available runtime probes against local HTTPS (no public network)
        run: CA_TRUST_AUDIT_RUNTIME_TESTS=1 go test -v -count=1 ./pkg/probes -run TestInstalledRuntimeTLS
      - name: Standalone Linux builds
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/ca-trust-audit-linux-amd64 ./cmd/ca-trust-audit
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/ca-trust-audit-linux-arm64 ./cmd/ca-trust-audit
      - name: Offline standalone smoke test
        run: |
          dist/ca-trust-audit-linux-amd64 --version
          scan_status=0
          dist/ca-trust-audit-linux-amd64 --host --offline --json report.json || scan_status=$?
          # A vulnerable runner bundle is a valid scanner result, not a broken build.
          test "$scan_status" -eq 0 || test "$scan_status" -eq 1
          test -s report.json
  docker-integration:
    name: Docker and PHP 8.5 integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Check Docker availability
        run: docker info --format '{{.ServerVersion}}'
      - name: Shell-less containers with conflicting trust stores
        env:
          CA_TRUST_AUDIT_DOCKER_TESTS: '1'
        run: go test -v -count=1 -timeout=3m ./pkg/audit -run '^TestRealDockerShellless$'
      - name: Pull representative PHP image
        run: docker pull webdevops/php-apache:8.5-alpine
      - name: PHP default CA bundle and positive/negative TLS probes
        env:
          CA_TRUST_AUDIT_PHP_IMAGE_TESTS: '1'
        run: go test -v -count=1 -timeout=2m ./pkg/probes -run '^TestPHP85Image$'
      - name: Standalone CLI output, JSON and exit codes on PHP image
        env:
          CA_TRUST_AUDIT_PHP_IMAGE_TESTS: '1'
        run: go test -v -count=1 -timeout=3m ./cmd/ca-trust-audit -run '^TestPHP85CLI$'
